# Example: substitute the broker's actual LAN address; never bind a public interface.
per_listener_settings true
# Broker cap applies before MQTT.js assembles incoming payloads.
max_packet_size 8192
message_size_limit 4096
listener 1883 192.168.1.15
allow_anonymous false
password_file /etc/mosquitto/powermeter.passwd
acl_file /etc/mosquitto/powermeter.acl
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
# Credentials are generated locally, not shipped in this repository.
# For untrusted Wi-Fi use a TLS listener (8883), cafile, certfile and keyfile.
