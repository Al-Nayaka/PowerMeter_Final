# Example only: replace server_name, LAN subnet and static root before installation.
# This server-level auth protects REST, WebSocket and static files together.
server {
    listen 80;
    server_name powermeter.lan;
    root /opt/powermeter/frontend/dist;
    index index.html;

    allow 127.0.0.1;
    allow 192.168.1.0/24;
    deny all;
    auth_basic "PowerMeter LAN";
    auth_basic_user_file /etc/nginx/powermeter.htpasswd;
    client_max_body_size 32k;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
